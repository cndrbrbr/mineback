# nginx config serving the mineback compat view (T8) — what MHS's own,
# unmodified spigot/mc-restore.sh fetches for student self-service restore.
#
# Only public/ is served. store/ (canonical, may include age-encrypted
# secrets), incoming/, catalog.sqlite and logs/ must never be reachable here
# (S4) — this file only ever points at public/, so keep it that way.
#
# Usage: symlink or copy into /etc/nginx/sites-enabled/, adjust the root
# path to match `home` in mineback.toml (public/ lives under it), reload.

server {
    listen 8080;
    listen [::]:8080;

    root /var/lib/mineback/public;

    # Directory listing helps an admin browse available dates in a browser;
    # harmless since nothing under public/ is sensitive (S4).
    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Belt-and-braces: even if a future change ever nests something under
    # public/, refuse to ever serve an age-encrypted or sqlite file from here.
    location ~ \.(age|sqlite)$ {
        deny all;
    }
}

# Does this need TLS?
#   Not for a LAN/workshop setup — plain HTTP on 8080 is what MHS's existing
#   backup-server/docker-compose.yml already does. If this must be reachable
#   over the public internet, put a TLS reverse proxy in front (e.g.
#   https://github.com/cndrbrbr/caddy-proxy) and point each host's
#   BACKUP_URL at the HTTPS address instead.
